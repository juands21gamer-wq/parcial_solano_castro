<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Aplicación</title>
  <!-- Bootstrap 5 CSS por CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

  <!-- 1. SECCIÓN: WIZARD (Formulario de Caracterización) -->
  <section id="wizard" class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="card-title text-center mb-4">Caracterización</h2>
            
            <form id="form-caracterizacion">
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre Completo</label>
                <input type="text" class="form-input form-control" id="nombre" placeholder="Ingresa tu nombre" required>
              </div>

              <div class="mb-3">
                <label for="ingreso" class="form-label">Ingreso Mensual / Presupuesto</label>
                <input type="number" class="form-control" id="ingreso" placeholder="0.00" required>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Guardar y Continuar</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 2. SECCIÓN: DASHBOARD (Oculto por defecto con d-none) -->
  <section id="dashboard" class="d-none">
    
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Mi Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Ajustes</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      
      <!-- 4 Cards de Resumen (Grid de Bootstrap) -->
      <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card text-white bg-primary">
            <div class="card-body">
              <h5 class="card-title">Presupuesto</h5>
              <p class="card-text fs-4 fw-bold">$0.00</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card text-white bg-danger">
            <div class="card-body">
              <h5 class="card-title">Gastos Totales</h5>
              <p class="card-text fs-4 fw-bold">$0.00</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card text-white bg-success">
            <div class="card-body">
              <h5 class="card-title">Saldo Disponible</h5>
              <p class="card-text fs-4 fw-bold">$0.00</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card text-white bg-info">
            <div class="card-body">
              <h5 class="card-title">Categorías</h5>
              <p class="card-text fs-4 fw-bold">0</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Módulo de Gastos Diarios -->
      <div class="row">
        <div class="col-12">
          <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
              <h4 class="card-title mb-0">Gastos Diarios</h4>
            </div>
            <div class="card-body">
              <form id="form-gastos" class="row g-3 mb-4">
                <div class="col-md-5">
                  <input type="text" class="form-control" placeholder="Concepto del gasto" required>
                </div>
                <div class="col-md-4">
                  <input type="number" class="form-control" placeholder="Monto" required>
                </div>
                <div class="col-md-3">
                  <button type="submit" class="btn btn-danger w-100">Agregar Gasto</button>
                </div>
              </form>

              <!-- Tabla / Lista de gastos -->
              <div class="table-responsive">
                <table class="table table-hover">
                  <thead>
                    <tr>
                      <th>Fecha</th>
                      <th>Concepto</th>
                      <th>Monto</th>
                    </tr>
                  </thead>
                  <tbody id="lista-gastos">
                    <!-- Aquí el JS agregará las filas -->
                  </tbody>
                </table>
              </div>

            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- Bootstrap 5 JS Bundle por CDN (antes de cerrar body) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
