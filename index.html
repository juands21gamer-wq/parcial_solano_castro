<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Aplicación</title>
  <!-- Bootstrap 5 CSS por CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

  <!-- 1. SECCIÓN: WIZARD (Formulario de Caracterización Avanzado) -->
<section id="wizard" class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h3 class="card-title mb-0">Configuración Inicial</h3>
        </div>
        <div class="card-body">
          <form id="form-caracterizacion">
            
            <!-- Ingreso Principal -->
            <div class="mb-4">
              <label for="ingreso-principal" class="form-label fw-bold">Ingreso Principal</label>
              <input type="number" step="0.01" class="form-control" id="ingreso-principal" placeholder="Ej. 2500000" required>
            </div>

            <hr class="my-4">

            <!-- Ingresos Adicionales Dinámicos -->
            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Ingresos Adicionales</h5>
                <button type="button" class="btn btn-outline-success btn-sm" id="btn-add-ingreso">
                  + Agregar Ingreso
                </button>
              </div>
              <div id="contenedor-ingresos-adicionales" class="d-flex flex-column gap-2">
                <!-- Filas dinámicas de ingresos adicionales -->
              </div>
            </div>

            <hr class="my-4">

            <!-- Gastos Fijos Dinámicos -->
            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Gastos Fijos</h5>
                <button type="button" class="btn btn-outline-danger btn-sm" id="btn-add-gasto">
                  + Agregar Gasto Fijo
                </button>
              </div>
              <div id="contenedor-gastos-fijos" class="d-flex flex-column gap-3">
                <!-- Filas dinámicas de gastos fijos -->
              </div>
            </div>

            <!-- Botón Final -->
            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-primary btn-lg">Guardar Configuración</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</section>

  <!-- 2. SECCIÓN: DASHBOARD (Oculto por defecto con d-none) -->
  <section id="dashboard" class="d-none">
    
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Mi Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Ajustes</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      
      <!-- 4 Cards de Resumen (Grid de Bootstrap) -->
      <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card text-white bg-primary">
            <div class="card-body">
              <h5 class="card-title">Presupuesto</h5>
              <p class="card-text fs-4 fw-bold">$0.00</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card text-white bg-danger">
            <div class="card-body">
              <h5 class="card-title">Gastos Totales</h5>
              <p class="card-text fs-4 fw-bold">$0.00</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card text-white bg-success">
            <div class="card-body">
              <h5 class="card-title">Saldo Disponible</h5>
              <p class="card-text fs-4 fw-bold">$0.00</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card text-white bg-info">
            <div class="card-body">
              <h5 class="card-title">Categorías</h5>
              <p class="card-text fs-4 fw-bold">0</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Módulo de Gastos Diarios -->
      <div class="row">
        <div class="col-12">
          <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
              <h4 class="card-title mb-0">Gastos Diarios</h4>
            </div>
            <div class="card-body">
              <form id="form-gastos" class="row g-3 mb-4">
                <div class="col-md-5">
                  <input type="text" class="form-control" placeholder="Concepto del gasto" required>
                </div>
                <div class="col-md-4">
                  <input type="number" class="form-control" placeholder="Monto" required>
                </div>
                <div class="col-md-3">
                  <button type="submit" class="btn btn-danger w-100">Agregar Gasto</button>
                </div>
              </form>

              <!-- Tabla / Lista de gastos -->
              <div class="table-responsive">
                <table class="table table-hover">
                  <thead>
                    <tr>
                      <th>Fecha</th>
                      <th>Concepto</th>
                      <th>Monto</th>
                    </tr>
                  </thead>
                  <tbody id="lista-gastos">
                    <!-- Aquí el JS agregará las filas -->
                  </tbody>
                </table>
              </div>

            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Tu archivo JS personalizado -->
  <script src="./js/javascript.js"></script>
  
</body>
</body>
</html>
